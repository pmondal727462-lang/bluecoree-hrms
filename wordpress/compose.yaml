name: bluecoree-wordpress-test
services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bluecoree_test
      MYSQL_USER: bluecoree_test
      MYSQL_PASSWORD: ${WP_TEST_PASSWORD:?Run start-local.ps1 first}
      MYSQL_ROOT_PASSWORD: ${WP_TEST_ROOT_PASSWORD:?Run start-local.ps1 first}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 5s
      timeout: 3s
      retries: 30
  wordpress:
    image: wordpress:php8.3-apache
    ports:
      - 127.0.0.1:8090:80
    depends_on:
      database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_NAME: bluecoree_test
      WORDPRESS_DB_USER: bluecoree_test
      WORDPRESS_DB_PASSWORD: ${WP_TEST_PASSWORD}
    volumes:
      - wordpress:/var/www/html
      - ./bluecoree-hr:/var/www/html/wp-content/plugins/bluecoree-hr:ro
      - ./tests:/opt/bluecoree-tests:ro
volumes:
  database:
  wordpress:
